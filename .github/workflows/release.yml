name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  trimui-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches project version
        shell: bash
        run: |
          project_version=$(sed -nE 's/^project\(pocket_music VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          test "v${project_version}" = "${GITHUB_REF_NAME}"

      - name: Build TrimUI package
        run: make trimui-package

      - name: Create release archive
        run: cd build/trimui && zip -r "PocketMusic-${GITHUB_REF_NAME}.zip" PocketMusic

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "build/trimui/PocketMusic-${GITHUB_REF_NAME}.zip" --generate-notes
