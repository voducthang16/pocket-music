name: Phase 2 Format Fix

on:
  push:
    branches:
      - refactor/update-subsystem

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style: format Phase 2 sources'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Format changed C++ files
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format
          files=$(git diff --name-only origin/main...HEAD -- '*.cpp' '*.hpp')
          if [ -n "$files" ]; then
            clang-format -i $files
          fi

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.cpp' '*.hpp'
          git commit -m 'style: format Phase 2 sources'
          git push origin HEAD:refactor/update-subsystem
