name: Phase 2 Plan Finalizer

on:
  push:
    branches:
      - refactor/update-subsystem

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update Phase 2 plan and README truth
        run: python3 .github/scripts/finalize_phase2.py

      - name: Commit plan and documentation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REFACTOR-PLAN.md README.md
          git commit -m "docs: complete Phase 2 refactor checklist"
          git push origin HEAD:refactor/update-subsystem
