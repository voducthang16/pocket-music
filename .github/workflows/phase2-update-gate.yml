name: Phase 2 Update Gate

on:
  push:
    branches:
      - refactor/update-subsystem

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check formatting
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format
          files=$(git diff --name-only origin/main...HEAD -- '*.cpp' '*.hpp')
          if [ -n "$files" ]; then
            clang-format --dry-run --Werror $files
          fi

      - name: Build TrimUI package
        run: make trimui-package

      - name: Verify updater package layout
        run: |
          test -x build/trimui/PocketMusic/update/prepare-update.sh
          test -x build/trimui/PocketMusic/update/apply-update.sh
          test ! -e build/trimui/PocketMusic/update/check-update.sh
          file build/trimui/PocketMusic/bin/pocket-music | grep -E 'ARM aarch64|AArch64'
