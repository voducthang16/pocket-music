name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            curl \
            pkg-config \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-ttf-dev \
            libtag1-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev

      - name: Validate TrimUI scripts
        run: sh -n platform/trimui/launch.sh platform/trimui/update/check-update.sh platform/trimui/update/apply-update.sh tests/test_trimui_update.sh

      - name: Test TrimUI updater
        run: sh tests/test_trimui_update.sh

      - name: Run tests
        run: make test
