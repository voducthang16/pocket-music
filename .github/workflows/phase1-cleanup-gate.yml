name: Phase 1 Cleanup Gate

on:
  push:
    branches:
      - refactor/codebase-cleanup

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check formatting
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format
          files=$(git diff --name-only origin/main...HEAD -- '*.cpp' '*.hpp')
          if [ -n "$files" ]; then
            clang-format --dry-run --Werror $files
          fi

      - name: Build TrimUI package
        run: make trimui-package
