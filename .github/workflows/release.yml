name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  trimui-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify tag matches project version
        shell: bash
        run: |
          project_version=$(sed -nE 's/^project\(pocket_music VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          test "v${project_version}" = "${GITHUB_REF_NAME}"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            pkg-config \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-ttf-dev \
            libtag1-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev

      - name: Run automated tests
        run: make test

      - name: Build TrimUI package
        run: make trimui-package

      - name: Create release artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd build/trimui

          zip -r "PocketMusic-${GITHUB_REF_NAME}.zip" PocketMusic

          update_asset="PocketMusic-${GITHUB_REF_NAME}-update.tar.gz"
          tar --exclude='PocketMusic/data' -czf "${update_asset}" PocketMusic

          sha256=$(sha256sum "${update_asset}" | awk '{print $1}')
          size=$(stat -c '%s' "${update_asset}")
          version="${GITHUB_REF_NAME#v}"

          cat > pocket-music-update.txt <<EOF
          version=${version}
          asset=${update_asset}
          sha256=${sha256}
          size=${size}
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build/trimui/PocketMusic-${GITHUB_REF_NAME}.zip" \
            "build/trimui/PocketMusic-${GITHUB_REF_NAME}-update.tar.gz" \
            "build/trimui/pocket-music-update.txt" \
            --generate-notes
